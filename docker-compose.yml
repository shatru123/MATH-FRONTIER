version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: MathFrontier.Api/Dockerfile
    container_name: mathfrontier-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DATABASE_PROVIDER=sqlite
      - PORT=5000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - api-data:/app/data

volumes:
  api-data:
