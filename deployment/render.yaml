services:
  # 1. Backend Web Service (.NET 10 Web API)
  - type: web
    name: math-frontier-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: MathFrontier.Api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_PROVIDER
        value: sqlite
      - key: PORT
        value: "5000"
      - key: CORS_ORIGINS
        value: https://math-frontier-web.onrender.com
      - key: ENABLE_SWAGGER
        value: "true"

  # 2. Frontend Static Site (React + Vite SPA)
  - type: web
    name: math-frontier-web
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend/math-frontier-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://math-frontier-api.onrender.com
